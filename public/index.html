    return { x: Math.min(Math.max(margin, x), maxX), y: Math.min(Math.max(margin, y), maxY) };

  const start = e => {

    const t = e.touches ? e.touches[0] : e;

    setPos(next);

    dragging.current = false;
    setPos(p => { localStorage.setItem('wa_btn_pos', JSON.stringify(p)); return p; });
  };

  useEffect(() => {
    const onResize = () => setPos(p => clamp(p.x, p.y));
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);

const ZambianVoice = {

  },
  _process() {
    if (!this._queue.length) {

      text,

      rate,
      onEnd
    } = this._queue.shift();
    try {
      window.speechSynthesis.cancel();
    } catch (e) {}
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = rate || (gender === 'female' ? 0.75 : 0.78);
    utt.pitch = gender === 'female' ? 1.1 : 0.9;
    utt.volume = 1.0;
    utt.lang = 'en-GB';
    const v = this.pickVoice(gender);

  stop() {
    this._queue = [];

      window.speechSynthesis.cancel();

function QuestionsPage() {
  const {
    profile,
    socket
  } = useAuth();
  const {
    add
  } = useToast();
  const [asking, setAsking] = useState(false);
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [selSub, setSelSub] = useState(0);
  const [tab, setTab] = useState('ask');
  const [aiThinking, setAiThinking] = useState(false);
  const [showTokenModal, setShowTokenModal] = useState(false);
  const [qImage, setQImage] = useState(null);
  const [tokenStatus, setTokenStatus] = useState(null);
  const [aiPayForm, setAiPayForm] = useState({ plan: 'basic', method: 'MTN Mobile Money', transaction_id: '', notes: '' });
  const [aiPayBusy, setAiPayBusy] = useState(false);

  // Load token status
  useEffect(() => {
    if (!profile?._id) return;
    apiFetch('GET', '/ai-tokens/status', null, tok()).then(s => setTokenStatus(s)).catch(()=>{});
  }, [profile?._id]);

  // Listen for token approval in real time
  useEffect(() => {
    if (!socket) return;
    socket.on('ai_tokens_approved', (data) => {
      add({ title: '🎉 Study Tokens Activated!', body: data.tokens + ' tokens added! (' + data.plan + ' plan)', icon: '⭐', type: 'i' });
      window.pmNotify?.('Tokens Activated!', data.tokens + ' AI tokens added to your account!');
      apiFetch('GET', '/ai-tokens/status', null, tok()).then(s => setTokenStatus(s)).catch(()=>{});
    });
    return () => socket.off('ai_tokens_approved');
  }, [socket]);

  const submitAiPayment = async () => {
    if (!aiPayForm.transaction_id) { add({ title: 'Enter transaction ID', icon: '⚠️', type: 'w' }); return; }
    setAiPayBusy(true);
    try {
      const fd = new FormData();
      Object.entries(aiPayForm).forEach(([k,v]) => fd.append(k, v));
      await apiFetch('POST', '/ai-tokens/payment', null, tok(), fd);
      add({ title: '✅ Payment submitted!', body: 'Admin will approve shortly. You will get your tokens.', icon: '🤖', type: 'i' });
      setShowTokenModal(false);
    } catch(e) { add({ title: 'Failed', body: e.message, icon: '❌', type: 'd' }); }
    setAiPayBusy(false);
  };
  const [loading, setLoading] = useState(true);
  const chatRef = useRef();
  const ch = AI_CHARS[SUBJECTS.find(s => s.id === selSub)?.char || 'ken'] || AI_CHARS.ken;

  // Load group messages for selected subject
  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const d = await apiFetch('GET', `/messages/group/${selSub}`, null, tok());
        setMsgs(Array.isArray(d) ? d : []);
      } catch (e) {
        setMsgs([]);
      } finally {
        setLoading(false);
      }
    };
    load();
    if (!socket) return;
    const handler = m => {
      if (Number(m.subject_id) === Number(selSub)) {
        setMsgs(p => p.find(x => x._id === m._id) ? p : [...p, m]);
      }
    };
    socket.on('new_group_message', handler);
    socket.emit('join_group', selSub);
    return () => socket.off('new_group_message', handler);
  }, [selSub, socket]);
  useEffect(() => {
    setTimeout(() => {
      if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
    }, 100);
  }, [msgs]);
  const askQuestion = async () => {
    if (!input.trim()) return;
    const q = input.trim() || (qImage ? 'What is in this image? Please explain it.' : '');
    if (!q && !qImage) return;

    // Check AI tokens first
    try {
      const tokenResult = await apiFetch('POST', '/ai-tokens/use', {}, tok());
      if (tokenResult.error === 'NO_TOKENS') {
        setShowTokenModal(true);
        return;
      }
      // Update token display in real time
      setTokenStatus(prev => prev ? {
        ...prev,
        free_remaining: tokenResult.free_remaining,
        paid_tokens: tokenResult.paid_tokens,
        free_used: tokenResult.type === 'free' ? (prev.free_used||0)+1 : prev.free_used,
        can_ask: tokenResult.free_remaining > 0 || tokenResult.paid_tokens > 0
      } : prev);
    } catch(e) {
      if (e.message?.includes('NO_TOKENS') || e.message?.includes('free questions') || e.message?.includes('tokens')) {
        // Refresh token status
        apiFetch('GET', '/ai-tokens/status', null, tok()).then(s => setTokenStatus(s)).catch(()=>{});
        setShowTokenModal(true);
        return;
      }
    }

    setInput('');
    setAsking(true);
    setTab('chat');

    // Show question instantly
    const tempQ = { _id: 'tq_'+Date.now(), sender_id: profile?._id, content: q, createdAt: new Date().toISOString(), subject_id: selSub, type: 'group' };
    setMsgs(p => [...p, tempQ]);

    // Post to server
    try {
      const fd = new FormData();
      fd.append('subject_id', selSub);
      fd.append('content', q);
      const saved = await apiFetch('POST', '/messages/group', null, tok(), fd);
      if (saved?._id) setMsgs(p => p.map(m => m._id === tempQ._id ? saved : m));
    } catch (e) {}

    // Show AI thinking
    setAiThinking(true);
    const tempAI = { _id: 'tai_'+Date.now(), sender_id: 'ai', content: '\u23f3 Teacher Ken is thinking...', createdAt: new Date().toISOString(), subject_id: selSub, type: 'group' };
    setMsgs(p => [...p, tempAI]);

    try {
      const charKey = SUBJECTS.find(s => s.id === selSub)?.char || 'ken';
